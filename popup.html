<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;

  <body>

    <p>
      <strong>网格</strong>：恢复小红书默认展示。<br />

    <p>点击卡片会在新标签页打开原笔记。</p>
